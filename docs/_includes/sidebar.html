<nav>
  {%- for group in site.data.nav %}
  <section class="nav-group">
    <h2>{{ group.label }}</h2>
    <ul>
      {%- for item in group.items %}
      <li><a href="{{ item.url | relative_url }}"{% if item.url == page.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
      {%- endfor %}
    </ul>
  </section>
  {%- endfor %}
</nav>
