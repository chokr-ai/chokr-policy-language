[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chokr-policy-language"
dynamic = ["version"]
readme = "README.md"
description = "CHOKR Policy Language (CPL): AI agent governance as code. A deterministic policy language and engine for tool-call authorization, human approval and audit."
requires-python = ">=3.12"
authors = [{ name = "chokr-ai" }]
keywords = [
  "ai-governance", "agent-governance", "ai-agents", "agentic-ai", "guardrails", "policy-as-code", "policy-engine",
  "policy-language", "authorization", "human-in-the-loop", "audit-trail", "fail-closed", "deterministic", "chokr",
  "llm-guardrails", "agent-security", "ai-safety", "mcp", "tool-calling",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = [
  "ruamel.yaml>=0.18,<1",
  "rfc8785>=0.1.4,<0.2",
  "google-re2>=1.1.20251105",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
prove = ["z3-solver>=5.3.0.0"]

[project.urls]
Homepage = "https://github.com/chokr-ai/chokr-policy-language"
Repository = "https://github.com/chokr-ai/chokr-policy-language"
Issues = "https://github.com/chokr-ai/chokr-policy-language/issues"

[project.scripts]
cplang = "cplang.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2.0",
  "jsonschema>=4.22,<5",
  "z3-solver>=5.3.0.0",
  "pip-audit>=2.7",
]

[tool.hatch.version]
path = "src/cplang/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cplang"]

[tool.hatch.build.targets.wheel.force-include]
"conformance" = "cplang/data/conformance"
"schemas" = "cplang/data/schemas"
"registry" = "cplang/data/registry"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/conformance", "/schemas", "/registry", "/examples", "/tools", "/README.md", "/pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PT", "RUF", "S", "C4", "PIE", "PERF", "PTH", "T20", "W"]
ignore = ["RUF012", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT006", "PT018", "E501", "PT011", "PT012", "SIM117", "B017", "RUF005", "S101", "S105", "S106", "S108"]
"tools/**" = ["T201"]
"examples/**" = ["T201"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src/cplang"]

[[tool.mypy.overrides]]
module = ["re2", "z3"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -ra --strict-markers --strict-config"
markers = ["property: property-based tests (hypothesis)"]

[tool.coverage.run]
branch = true
source = ["cplang"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "^\\s*\\.\\.\\.$"]

[tool.importlinter]
root_package = "cplang"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The language imports no product and no network library"
type = "forbidden"
source_modules = ["cplang"]
forbidden_modules = ["chokr", "pydantic", "httpx", "requests", "aiohttp", "urllib3", "fastapi"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The command line and the conformance runner sit on top of the language"
type = "forbidden"
source_modules = [
  "cplang.evaluator", "cplang.policy", "cplang.compile", "cplang.declarations", "cplang.conditions", "cplang.fixtures", "cplang.prove",
  "cplang.expr", "cplang.types", "cplang.values", "cplang.ops", "cplang.matching", "cplang.runtime", "cplang.profile", "cplang.model",
]
forbidden_modules = ["cplang.cli", "cplang.conformance"]
